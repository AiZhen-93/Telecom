name: Update Network Status

on:
  workflow_dispatch:

concurrency:
  group: network-status
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - run: npm run update:network-status
        continue-on-error: true

      - name: Commit network status
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add network-status.json
          git commit -m "Update network status" || echo "No changes"
          git push
